---
name: Extract OSAC CLI
description: >-
  Extract the osac CLI binary from a fulfillment-service container image
  (baked into the image alongside the service binary -- see
  osac-project/osac's fulfillment-service/Containerfile) rather than
  building it from source or downloading a GitHub release. Guarantees the
  CLI matches whatever fulfillment-service image is actually being tested,
  with no separate release mechanism to fall out of sync with.

inputs:
  image:
    description: "Fully-qualified fulfillment-service image reference to extract the CLI from (e.g. ghcr.io/osac-project/fulfillment-service:sha-abc1234)"
    required: true
  output-path:
    description: "Where to write the extracted binary"
    required: false
    default: "${{ runner.temp }}/osac-cli-bin"

outputs:
  path:
    description: "Path to the extracted, executable osac CLI binary"
    value: ${{ steps.extract.outputs.path }}

runs:
  using: composite
  steps:
    - id: extract
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        OUTPUT_PATH: ${{ inputs.output-path }}
      run: |
        set -euo pipefail

        # Independently verify presence/absence of the binary first, rather
        # than inferring "missing" from a podman cp failure -- a cp failure
        # can just as easily mean a bad OUTPUT_PATH, no disk space, or a
        # runtime hiccup, none of which should be silently treated as "this
        # image predates the CLI." A missing /usr/local/bin/osac (genuinely
        # true for pre-#1015 images) is the ONLY case that takes the
        # fallback branch -- callers already have their own OSAC_VERSION
        # -based fallback for exactly that case, gated on this output being
        # a real, existing file.
        # A failed podman run is not proof that the CLI is absent. Have the
        # container report the result explicitly so runtime failures stop
        # the workflow instead of taking the missing-CLI fallback.
        if ! probe=$(podman run --rm --entrypoint sh "${IMAGE}" -c '
          if test -f /usr/local/bin/osac; then
            printf "CLI_PRESENT\n"
          else
            printf "CLI_MISSING\n"
          fi
        ' 2>/dev/null); then
          echo "::error::Could not check the fulfillment-service image for the OSAC CLI"
          exit 1
        fi
        if [[ "${probe}" == "CLI_MISSING" ]]; then
          echo "::warning::No /usr/local/bin/osac found in the fulfillment-service image; this image may predate the CLI being baked in (see osac-project/osac's fulfillment-service/Containerfile). The caller will decide how to proceed."
          echo "path=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ "${probe}" != "CLI_PRESENT" ]]; then
          echo "::error::Unexpected OSAC CLI check result from the fulfillment-service image"
          exit 1
        fi

        # The binary exists in the image, so from here any failure is a
        # real error (bad destination, disk full, runtime issue) and must
        # propagate -- not be swallowed as "CLI missing".
        if [[ -e "${OUTPUT_PATH}" && ! -f "${OUTPUT_PATH}" ]]; then
          echo "::error::output-path (${OUTPUT_PATH}) already exists and is not a regular file"
          exit 1
        fi

        if ! container_id=$(podman create "${IMAGE}" 2>/dev/null); then
          echo "::error::Could not create a container from the fulfillment-service image"
          exit 1
        fi
        trap 'podman rm "${container_id}" >/dev/null 2>&1 || true' EXIT
        podman cp "${container_id}:/usr/local/bin/osac" "${OUTPUT_PATH}"

        # A directory destination is podman cp's default behavior when
        # OUTPUT_PATH's parent looks like one -- guard against silently
        # reporting a directory as the "extracted binary" path.
        if [[ ! -f "${OUTPUT_PATH}" ]]; then
          echo "::error::podman cp reported success but ${OUTPUT_PATH} is not a regular file (is output-path a directory?)"
          exit 1
        fi

        chmod +x "${OUTPUT_PATH}"
        echo "path=${OUTPUT_PATH}" >> "$GITHUB_OUTPUT"
